# Validate current 0.2 beta
name: Lua Syntax Check

on:
  push:
  pull_request:

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          set -e
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done
